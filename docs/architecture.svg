<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Briefly AI Meeting Analyst — 3D system architecture</title>
  <desc id="description">An isometric system map showing Cognito-authenticated browser uploads and signature-verified Zoom and Microsoft Teams recording webhooks flowing through SQS, private S3, Lambda, Transcribe, Bedrock, DynamoDB, and SNS.</desc>
  <defs>
